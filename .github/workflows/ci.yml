name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8

      - name: Lint Python files
        run: flake8 app.py athena_helper.py bussiness-assessment-transform.py --max-line-length=150

      - name: Verify Python syntax
        run: |
          python -c "import ast; ast.parse(open('bussiness-assessment-transform.py').read())"
          python -c "import ast; ast.parse(open('app.py').read())"
          python -c "import ast; ast.parse(open('athena_helper.py').read())"
